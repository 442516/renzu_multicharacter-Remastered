<html lang="en"><head>
  <meta charset="UTF-8">
  <title>renzu_multicharacter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" id="css_default">
</head>

<body translate="no" id="body">
  <audio id="bgmusic" loop preload="auto"></audio>

  <div id="logocontainer">
    <img id="logo" src="/web/logo.png">
  </div>
  <div id='loading'><img src="/web/loading.gif" style="width: 5%;"></div>

  <div class="Modal" style="display: none;" id="confirm">
    <h2 class="Modal-InText" id="candelete" data-i18n="delete_confirm_title">
      Do you want to delete this character?
    </h2>
    <button class="Modal-InBtn Btn-Right" id="deletebutton" onclick="deletechar()" data-i18n="confirm">Confirm</button>
    <button class="Modal-InBtn Btn-Left" id="deletecancel" onclick="confirm(false)" data-i18n="close">Close</button>
  </div>

  <section class="area-sign-in" style="display: none;" id="register">
    <div class="sign-in">
      <form id="registerf">
        <input type="text" placeholder="First name" name="firstname" id="firstname" data-i18n-placeholder="first_name" required>
        <input type="text" placeholder="Last name" name="lastname" id="lastname" data-i18n-placeholder="last_name" required>
        <input type="text" placeholder="Gender" name="sex" hidden>
        <div class="form-item" id="sex">
          <div class="form-gender">
            <label class="gender">
              <input type="radio" name="sex" value='m'>
              <span class="male" data-i18n="male">Male</span>
            </label>
            <label class="gender">
              <input type="radio" name="sex" value='f'>
              <span class="female" data-i18n="female">Female</span>
            </label>
            <label class="gender">
              <input type="radio" name="sex" value='m'>
              <span class="other" data-i18n="other">Other</span>
            </label>
          </div>
        </div>
        <input type="date" id="dateofbirth" name="dateofbirth">
        <br>
        <select id="selectCountry" name="nationality">
          <option value="" data-i18n="nationality">Nationality</option>
        </select>
        <br>
        <textarea id="freeform" name="freeform" rows="4" cols="50" data-i18n-placeholder="background_story" placeholder="Background story:" style="height:50px;background-color:#252a34; border-radius: 9px; text-align: center;padding-top:10px;color:fefefe;"></textarea>
        <input type="submit" id="registersubmit" data-i18n-value="enter" value="Enter" onclick="event.preventDefault(); register()" />
      </form>
    </div>
  </section>

  <div class="char" id="multi" style="display:none;">
    <div class="char__container">
      <div class="char__list">
        <header>
          <img id="minilogo" src="https://forum.cfx.re/uploads/default/original/4X/f/7/b/f7bd789d9d3ad55ff91dc57979e485e99e1a5273.png">
          <h1 id="mychar" data-i18n="my_characters">My Characters</h1>
        </header>
        <div id="characters"></div>
      </div>
    </div>

    <div id="option">
      <button onclick="chooseslot()" id="login" data-i18n="choose">Choose</button>
      <button onclick="confirm(true)" id="delete" data-i18n="delete">Delete</button>
    </div>
    <div id="registercustom" style="display: none;top: 35%;right: 12%;position: absolute;box-shadow: 1px 2px 4px #54585e, 1px -1px 1px #484b50;">
      <button onclick="registercustom()" id="logincustom" data-i18n="create" style="font-size: 30px;width: 300px;padding: 20px;background: #242934;box-shadow: 1px 2px 4px #54585e, 1px -1px 1px #484b50;">Create</button>
    </div>
    <div id="charinfo" style="position: absolute;display: none;top: 30%;right: 5%;">
      <div class="char__card" style="display: flex;flex-direction: column!important;">
        <div class="char__data" style="display: flex;flex-direction: column!important;padding: 15px;">
          <h1 style="font-size: 1.2em;"><i class="fas fa-user-circle" aria-hidden="true" style="font-size: 1.5em;padding-right: 5px;"></i> <span data-i18n="character_info">Character Info</span></h1>
          <section id="infos"></section>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== integrated spawn selector (was a separate renzu_spawn resource/NUI) ===== -->
  <div id="spawncontainer">
    <div id="spawntitle" data-i18n="spawn_title">Choose your spawn location</div>
    <section class="spawn">
      <div class="spawn-container" id="spawn"></div>
      <div class="prev-cont card-mover-btn">
        <button class="prev btn">&#60;</button>
      </div>
      <div class="next-cont card-mover-btn">
        <button class="next btn">&#62;</button>
      </div>
    </section>
    <div id="lastloccontainer">
      <button type="button" class="card-btn" onclick="spawnSelect('lastloc')" id="lastloc"><i class="fas fa-location-arrow"></i> <span data-i18n="spawn_last_location">Last Location</span></button>
    </div>
  </div>

<script src="script.js"></script>
</body></html>
